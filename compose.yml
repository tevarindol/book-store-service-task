services:
  bookstore:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      default:
        aliases:
          - bookstore.internal
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
    ports:
      - "8080:8080"
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  netbird:
    image: docker.io/netbirdio/netbird:0.83.2-rootless
    hostname: bookstore
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN, SYS_RESOURCE]
    volumes:
      - netbird_data:/var/lib/netbird
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY}
    depends_on:
      bookstore:
        condition: service_started
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  netbird_data:
  postgres_data:
