services:
  bookstore:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
    restart: unless-stopped

  anubis:
    image: ghcr.io/techarohq/anubis:v1.28.2
    depends_on:
      - bookstore
    environment:
      BIND: ":8080"
      TARGET: http://bookstore:8080
      USE_REMOTE_ADDRESS: "true"
      COOKIE_SECURE: "${JWT_COOKIE_SECURE:-false}"
      COOKIE_SAME_SITE: Lax
      COOKIE_PARTITIONED: "false" # Partitioned cookies require HTTPS on non-localhost hosts.
    networks:
      default:
        aliases:
          - bookstore.internal
    ports:
      - "8080:8080"
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  netbird:
    image: docker.io/netbirdio/netbird:0.83.2-rootless
    hostname: bookstore
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN, SYS_RESOURCE]
    volumes:
      - netbird_data:/var/lib/netbird
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY}
    depends_on:
      anubis:
        condition: service_started
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  netbird_data:
  postgres_data:
