<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{profile.title})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto my-10 max-w-2xl px-4 sm:px-6">
      <section class="rounded-2xl border border-stone-200 bg-white p-7 shadow-sm sm:p-9">
        <h1 class="text-3xl font-semibold tracking-tight text-stone-900" th:text="#{profile.title}">
          Your profile
        </h1>
        <p
          class="my-5 rounded-lg bg-emerald-50 px-4 py-3 text-emerald-900"
          th:if="${param.updated}"
        >
          <span th:text="#{account.updated}"></span>
        </p>
        <p class="mt-6 border-b border-stone-100 pb-5 text-sm">
          <strong class="text-stone-500" th:text="#{auth.email} + ': '"></strong>
          <span class="font-medium text-stone-900" th:text="${account.email}"></span>
        </p>
        <form
          th:action="@{/profile}"
          th:object="${profileForm}"
          method="post"
          class="mt-6 grid gap-2"
        >
          <label class="text-sm font-medium text-stone-700" th:text="#{auth.firstName}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{firstName}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{firstName}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.lastName}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{lastName}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{lastName}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.phone}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{phone}"
          >
          <small class="text-sm text-red-700" th:errors="*{phone}"></small>
          <button
            class="mt-4 rounded-lg bg-emerald-800 px-4 py-3 font-semibold text-white hover:bg-emerald-900"
            th:text="#{profile.save}"
          >
            Save changes
          </button>
        </form>
        <form
          th:if="${!employee}"
          th:action="@{/profile/delete}"
          method="post"
          class="mt-8 border-t border-stone-200 pt-6"
          th:onsubmit="|return confirm('#{account.deleteConfirm}')|"
        >
          <button
            class="rounded-lg border border-red-200 px-4 py-2.5 text-sm font-semibold text-red-700 hover:bg-red-50"
            th:text="#{profile.delete}"
          >
            Delete account
          </button>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
