<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{common.error})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto max-w-3xl px-4 py-24 text-center sm:px-6">
      <p
        class="text-sm font-bold uppercase tracking-[0.2em] text-amber-700"
        th:text="${status} + ' · ' + #{error.title}"
      ></p>
      <h1
        class="mt-4 text-4xl font-semibold tracking-tight text-stone-900"
        th:text="${message}"
      ></h1>
      <a
        class="mt-8 inline-flex rounded-lg bg-emerald-800 px-5 py-3 font-semibold text-white hover:bg-emerald-900"
        th:href="@{/books}"
        th:text="#{nav.catalog}"
      ></a>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
