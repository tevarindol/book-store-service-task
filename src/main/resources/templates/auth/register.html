<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{auth.register})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto my-12 max-w-xl px-4 sm:px-6">
      <section class="rounded-2xl border border-stone-200 bg-white p-7 shadow-sm sm:p-9">
        <h1 class="text-3xl font-semibold tracking-tight text-stone-900" th:text="#{auth.register}">
          Create account
        </h1>
        <form
          th:action="@{/register}"
          th:object="${accountForm}"
          method="post"
          class="mt-7 grid gap-2"
        >
          <label class="text-sm font-medium text-stone-700" th:text="#{auth.firstName}">
            First name
          </label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{firstName}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{firstName}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.lastName}">
            Last name
          </label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{lastName}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{lastName}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.email}">
            Email
          </label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="email"
            th:field="*{email}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{email}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.phone}">
            Phone
          </label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{phone}"
          >
          <small class="text-sm text-red-700" th:errors="*{phone}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.password}">
            Password
          </label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="password"
            th:field="*{password}"
            required
            autocomplete="new-password"
          >
          <small class="text-xs text-stone-500" th:text="#{auth.passwordHint}"></small>
          <small class="text-sm text-red-700" th:errors="*{password}"></small>
          <button
            class="mt-4 rounded-lg bg-emerald-800 px-4 py-3 font-semibold text-white hover:bg-emerald-900"
            th:text="#{auth.register}"
          >
            Create account
          </button>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
