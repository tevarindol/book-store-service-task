<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{auth.login})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto my-12 max-w-md px-4 sm:px-6">
      <section class="rounded-2xl border border-stone-200 bg-white p-7 shadow-sm sm:p-9">
        <h1 class="text-3xl font-semibold tracking-tight text-stone-900" th:text="#{auth.login}">
          Sign in
        </h1>
        <p
          class="my-4 rounded-lg bg-emerald-50 px-4 py-3 text-sm text-emerald-900"
          th:if="${notice}"
          th:text="${#messages.msg(notice)}"
        ></p>
        <p
          class="my-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800"
          th:if="${param.error}"
          th:text="#{login.invalid}"
        ></p>
        <p
          class="my-4 rounded-lg bg-stone-100 px-4 py-3 text-sm text-stone-700"
          th:if="${param.logout}"
        >
          <span th:text="#{login.signedOut}"></span>
        </p>
        <form th:action="@{/login}" method="post" class="mt-7 grid gap-2">
          <label class="text-sm font-medium text-stone-700" th:text="#{auth.email}">Email</label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="email"
            name="username"
            required
            autocomplete="email"
          >
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.password}">
            Password
          </label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="password"
            name="password"
            required
            autocomplete="current-password"
          >
          <button
            class="mt-4 rounded-lg bg-emerald-800 px-4 py-3 font-semibold text-white hover:bg-emerald-900"
            th:text="#{auth.login}"
          >
            Sign in
          </button>
        </form>
        <p class="mt-6 text-sm text-stone-600">
          <a
            class="font-semibold text-emerald-800 hover:underline"
            th:href="@{/register}"
            th:text="#{nav.register}"
          >
            Create an account
          </a>
        </p>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
