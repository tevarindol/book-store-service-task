<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{employee.books})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <h1
          class="text-3xl font-semibold tracking-tight text-stone-900"
          th:text="#{employee.books}"
        >
          Manage books
        </h1>
        <a
          class="rounded-lg bg-emerald-800 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-900"
          th:href="@{/employee/books/new}"
          th:text="#{employee.addBook}"
        >
          Add book
        </a>
      </div>
      <div class="mt-7 overflow-x-auto rounded-xl border border-stone-200 bg-white shadow-sm">
        <table class="w-full min-w-[700px] text-left text-sm">
          <thead class="bg-stone-50 text-xs uppercase tracking-wide text-stone-500">
            <tr>
              <th class="px-4 py-3" th:text="#{book.title}">Title</th>
              <th class="px-4 py-3" th:text="#{book.author}">Author</th>
              <th class="px-4 py-3" th:text="#{book.price}">Price</th>
              <th class="px-4 py-3" th:text="#{common.stock}"></th>
              <th class="px-4 py-3" th:text="#{employee.bookStatus}"></th>
              <th class="px-4 py-3" th:text="#{common.actions}">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-stone-100">
            <tr th:each="book : ${books}">
              <td class="px-4 py-3 font-medium text-stone-900" th:text="${book.title}"></td>
              <td class="px-4 py-3 text-stone-600" th:text="${book.author}"></td>
              <td class="px-4 py-3" th:text="${#numbers.formatDecimal(book.price, 1, 2)}"></td>
              <td class="px-4 py-3" th:text="${book.stockQuantity}"></td>
              <td
                class="px-4 py-3 text-stone-600"
                th:text="${book.active ? #messages.msg('book.active') : #messages.msg('book.archived')}"
              ></td>
              <td class="flex items-center gap-2 px-4 py-3">
                <a
                  class="rounded-md border border-stone-300 px-3 py-1.5 text-xs font-semibold text-stone-700 hover:bg-stone-50"
                  th:href="@{/employee/books/{id}/edit(id=${book.id})}"
                  th:text="#{common.edit}"
                ></a>
                <form
                  th:if="${book.active}"
                  th:action="@{/employee/books/{id}/delete(id=${book.id})}"
                  method="post"
                >
                  <button
                    class="rounded-md bg-red-700 px-3 py-1.5 text-xs font-semibold text-white hover:bg-red-800"
                    th:text="#{book.archive}"
                  ></button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <a
        class="mt-6 inline-block text-sm text-stone-500 hover:text-emerald-800"
        th:href="@{/employee}"
        th:text="'← ' + #{common.back}"
      ></a>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
