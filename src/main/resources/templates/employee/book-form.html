<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{employee.books})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto my-10 max-w-2xl px-4 sm:px-6">
      <section class="rounded-2xl border border-stone-200 bg-white p-7 shadow-sm sm:p-9">
        <h1
          class="text-3xl font-semibold tracking-tight text-stone-900"
          th:text="${editing ? #messages.msg('book.edit') : #messages.msg('book.addTitle')}"
        ></h1>
        <form
          th:if="${editing}"
          th:action="@{/employee/books/{id}(id=${bookId})}"
          th:object="${bookForm}"
          method="post"
          class="mt-6 grid gap-2"
        >
          <label class="text-sm font-medium text-stone-700" th:text="#{book.isbn}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{isbn}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{isbn}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{book.title}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{title}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{title}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{book.author}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{author}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{author}"></small>
          <label
            class="mt-3 text-sm font-medium text-stone-700"
            th:text="#{book.description}"
          ></label>
          <textarea
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{description}"
            rows="5"
            required
          ></textarea>
          <small class="text-sm text-red-700" th:errors="*{description}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{book.price}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="number"
            min="0.01"
            step="0.01"
            th:field="*{price}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{price}"></small>
          <label
            class="mt-3 text-sm font-medium text-stone-700"
            th:text="#{employee.stock}"
          ></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="number"
            min="0"
            th:field="*{stockQuantity}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{stockQuantity}"></small>
          <label class="mt-3 flex items-center gap-2 text-sm font-medium text-stone-700">
            <input class="size-4 accent-emerald-800" type="checkbox" th:field="*{active}">
            <span th:text="#{book.active}"></span>
          </label>
          <button
            class="mt-4 rounded-lg bg-emerald-800 px-4 py-3 font-semibold text-white hover:bg-emerald-900"
            th:text="#{common.save}"
          ></button>
        </form>
        <form
          th:unless="${editing}"
          th:action="@{/employee/books}"
          th:object="${bookForm}"
          method="post"
          class="mt-6 grid gap-2"
        >
          <label class="text-sm font-medium text-stone-700" th:text="#{book.isbn}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{isbn}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{isbn}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{book.title}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{title}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{title}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{book.author}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{author}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{author}"></small>
          <label
            class="mt-3 text-sm font-medium text-stone-700"
            th:text="#{book.description}"
          ></label>
          <textarea
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{description}"
            rows="5"
            required
          ></textarea>
          <small class="text-sm text-red-700" th:errors="*{description}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{book.price}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="number"
            min="0.01"
            step="0.01"
            th:field="*{price}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{price}"></small>
          <label
            class="mt-3 text-sm font-medium text-stone-700"
            th:text="#{employee.stock}"
          ></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="number"
            min="0"
            th:field="*{stockQuantity}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{stockQuantity}"></small>
          <label class="mt-3 flex items-center gap-2 text-sm font-medium text-stone-700">
            <input class="size-4 accent-emerald-800" type="checkbox" th:field="*{active}">
            <span th:text="#{book.active}"></span>
          </label>
          <button
            class="mt-4 rounded-lg bg-emerald-800 px-4 py-3 font-semibold text-white hover:bg-emerald-900"
            th:text="#{common.save}"
          ></button>
        </form>
        <p class="mt-6">
          <a
            class="text-sm text-stone-500 hover:text-emerald-800"
            th:href="@{/employee/books}"
            th:text="'← ' + #{common.back}"
          ></a>
        </p>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
