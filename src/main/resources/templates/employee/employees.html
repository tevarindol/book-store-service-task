<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{employee.staff})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-semibold tracking-tight text-stone-900" th:text="#{employee.staff}">
        Employees
      </h1>
      <div class="mt-7 overflow-x-auto rounded-xl border border-stone-200 bg-white shadow-sm">
        <table class="w-full min-w-[600px] text-left text-sm">
          <thead class="bg-stone-50 text-xs uppercase tracking-wide text-stone-500">
            <tr>
              <th class="px-4 py-3" th:text="#{common.name}"></th>
              <th class="px-4 py-3" th:text="#{auth.email}"></th>
              <th class="px-4 py-3" th:text="#{auth.phone}"></th>
              <th class="px-4 py-3" th:text="#{common.actions}"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-stone-100">
            <tr th:each="staff : ${employees}">
              <td
                class="px-4 py-3 font-medium text-stone-900"
                th:text="${staff.firstName + ' ' + staff.lastName}"
              ></td>
              <td class="px-4 py-3 text-stone-600" th:text="${staff.email}"></td>
              <td class="px-4 py-3 text-stone-600" th:text="${staff.phone}"></td>
              <td class="px-4 py-3">
                <form
                  th:action="@{/employee/employees/{email}/delete(email=${staff.email})}"
                  method="post"
                >
                  <button
                    class="rounded-md bg-red-700 px-3 py-2 text-xs font-semibold text-white hover:bg-red-800"
                    th:text="#{employee.remove}"
                  ></button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <section class="mt-9 max-w-2xl rounded-2xl border border-stone-200 bg-white p-7 shadow-sm">
        <h2 class="text-xl font-semibold text-stone-900" th:text="#{employee.addTitle}"></h2>
        <form
          th:action="@{/employee/employees}"
          th:object="${accountForm}"
          method="post"
          class="mt-6 grid gap-2"
        >
          <label class="text-sm font-medium text-stone-700" th:text="#{auth.firstName}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{firstName}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{firstName}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.lastName}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{lastName}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{lastName}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.email}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="email"
            th:field="*{email}"
            required
          >
          <small class="text-sm text-red-700" th:errors="*{email}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.phone}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            th:field="*{phone}"
          >
          <small class="text-sm text-red-700" th:errors="*{phone}"></small>
          <label class="mt-3 text-sm font-medium text-stone-700" th:text="#{auth.password}"></label>
          <input
            class="rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-100"
            type="password"
            th:field="*{password}"
            required
          >
          <small class="text-xs text-stone-500" th:text="#{auth.passwordHint}"></small>
          <small class="text-sm text-red-700" th:errors="*{password}"></small>
          <button
            class="mt-4 rounded-lg bg-emerald-800 px-4 py-3 font-semibold text-white hover:bg-emerald-900"
            th:text="#{common.add}"
          ></button>
        </form>
      </section>
      <a
        class="mt-6 inline-block text-sm text-stone-500 hover:text-emerald-800"
        th:href="@{/employee}"
        th:text="'← ' + #{common.back}"
      ></a>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
