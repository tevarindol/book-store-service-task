<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{locale.tag}">
  <head th:replace="~{fragments/layout :: head(#{employee.title})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-semibold tracking-tight text-stone-900" th:text="#{employee.title}">
        Employee area
      </h1>
      <div class="mt-8 grid gap-5 sm:grid-cols-2">
        <a
          class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md"
          th:href="@{/employee/books}"
        >
          <h2 class="text-xl font-semibold text-stone-900" th:text="#{employee.books}"></h2>
        </a>
        <a
          class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md"
          th:href="@{/employee/orders}"
        >
          <h2 class="text-xl font-semibold text-stone-900" th:text="#{employee.orders}"></h2>
        </a>
        <a
          class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md"
          th:href="@{/employee/customers}"
        >
          <h2 class="text-xl font-semibold text-stone-900" th:text="#{employee.customers}"></h2>
        </a>
        <a
          class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md"
          th:href="@{/employee/employees}"
        >
          <h2 class="text-xl font-semibold text-stone-900" th:text="#{employee.staff}"></h2>
        </a>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
